<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متابعة أجهزتك - The First</title>
<style>
:root{
  --bg:#fef9f0; --card:#ffffff; --text:#1f2430; --muted:#8a8f9a;
  --accent:#2563eb; --accent2:#f59e0b; --border:#eee0c8; --ok:#059669; --bad:#dc2626;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Tahoma,Arial,sans-serif;}
header{background:linear-gradient(120deg,#2563eb,#3b82f6);color:#fff;padding:18px 16px;position:sticky;top:0;z-index:10;text-align:center;}
header h1{margin:0;font-size:17px;}
header p{margin:4px 0 0;font-size:12.5px;opacity:.9;}
main{max-width:640px;margin:0 auto;padding:14px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.03);}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px;font-weight:600;}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#fffdf8;color:var(--text);font-size:16px;font-family:inherit;}
button.primary{width:100%;margin-top:14px;padding:13px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
button.ghost{background:transparent;border:1.5px solid var(--border);color:var(--text);width:auto;padding:9px 14px;margin-top:0;font-size:13px;border-radius:8px;font-weight:600;cursor:pointer;}
.msg{font-size:13px;margin-top:8px;text-align:center;}
.msg.ok{color:var(--ok);} .msg.bad{color:var(--bad);}
.hidden{display:none !important;}
.hint{font-size:12.5px;color:var(--muted);text-align:center;padding:16px;}
.status-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.kpi{background:#fffaf0;border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;}
.kpi .num{font-size:22px;font-weight:800;color:var(--accent);}
.kpi .lbl{font-size:12px;color:var(--muted);margin-top:4px;}
.inv-item{padding:14px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:#fffdf8;}
.inv-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.inv-code{font-weight:800;font-size:14px;}
.inv-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.inv-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
table th,table td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap;}
table th{color:var(--muted);font-weight:700;background:#fffaf0;}
.device-card{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:#fffdf8;}
.device-card h4{margin:0 0 8px;font-size:14px;}
.device-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--border);}
.device-row:last-child{border-bottom:none;}
.photo-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.photo-row img{width:72px;height:72px;object-fit:cover;border-radius:8px;cursor:zoom-in;}
.lightbox-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px;}
.lightbox-overlay img{max-width:100%;max-height:92vh;border-radius:10px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal-box{background:#fff;border-radius:16px;padding:18px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;}
.modal-box h3{margin:0 0 12px;font-size:16px;}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
</style>
</head>
<body>

<header>
  <h1>🎮 مركز فرست لصيانة البلايستيشن</h1>
  <p>تابع حالة أجهزتك بسهولة</p>
</header>

<main>

  <!-- ===================== تسجيل الدخول ===================== -->
  <section id="loginBox" class="card">
    <label>رقم التليفون المسجّل بيه جهازك</label>
    <input id="loginPhone" type="tel" placeholder="01xxxxxxxxx" inputmode="numeric">
    <label>الباسورد</label>
    <input id="loginPassword" type="password" placeholder="الباسورد اللي استلمته من المركز">
    <button class="primary" id="btnLogin">دخول</button>
    <div class="msg" id="loginMsg"></div>
  </section>

  <!-- ===================== صفحة العميل ===================== -->
  <section id="custBox" class="hidden">
    <div class="card">
      <div class="top-bar">
        <h3 style="margin:0;font-size:16px;" id="custName"></h3>
        <button class="ghost" id="btnLogout">خروج</button>
      </div>
      <div class="kpi-grid">
        <div class="kpi"><div class="num" id="kpiInCenter">0</div><div class="lbl">أجهزة موجودة في المركز دلوقتي</div></div>
        <div class="kpi"><div class="num" id="kpiDevDue">0</div><div class="lbl">مطلوب على الأجهزة (ج)</div></div>
        <div class="kpi"><div class="num" id="kpiDebt">0</div><div class="lbl">دين إضافي (ج)</div></div>
        <div class="kpi"><div class="num" id="kpiDue">0</div><div class="lbl">إجمالي المطلوب (ج)</div></div>
      </div>
      <div style="margin-top:12px;padding:12px;border:1px solid var(--border);border-radius:10px;background:#fffaf0;">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <span style="font-size:13px;">🔑 الباسورد بتاعك:</span>
          <b id="pwDisplay" style="letter-spacing:2px;">••••••</b>
          <button class="ghost" style="padding:4px 10px;" id="btnTogglePw">إظهار</button>
          <button class="ghost" style="padding:4px 10px;" id="btnChangePw">تغيير</button>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="primary" style="flex:1;margin-top:0;" id="btnViewInvoices">📄 عرض الفواتير</button>
        <button class="ghost" style="flex:1;" id="btnViewDevices">🖥️ عرض الأجهزة</button>
      </div>
      <div id="statusFilterBar" class="hidden" style="margin-top:10px;">
        <label>فلترة حسب الحالة</label>
        <select id="statusFilter"><option value="">كل الحالات</option></select>
      </div>
    </div>
    <div id="invoicesList"></div>
  </section>

</main>

<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal-box" id="modalBox"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

function esc(s){ return (s||"").toString().replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const STATUSES = ["تم الاستلام","جاري الفحص","جاري الإصلاح","تم الإصلاح","تم التسليم"];
const STATUS_COLORS = {"تم الاستلام":"#64748b","جاري الفحص":"#2563eb","جاري الإصلاح":"#f59e0b","تم الإصلاح":"#059669","تم التسليم":"#7c3aed"};
document.getElementById("statusFilter").innerHTML += STATUSES.map(s=>`<option>${s}</option>`).join("");

function openModal(html){ document.getElementById("modalBox").innerHTML = html; document.getElementById("modalOverlay").classList.remove("hidden"); }
function closeModal(){ document.getElementById("modalOverlay").classList.add("hidden"); }
document.getElementById("modalOverlay").addEventListener("click", e=>{ if(e.target.id==="modalOverlay") closeModal(); });

function openLightbox(url){
  const ov = document.createElement("div");
  ov.className = "lightbox-overlay";
  ov.innerHTML = `<img src="${url}">`;
  ov.addEventListener("click", ()=> ov.remove());
  document.body.appendChild(ov);
}
document.addEventListener("click", e=>{
  const img = e.target.closest(".lightbox-trigger");
  if(img) openLightbox(img.src);
});

function normalizePhone(p){
  let d = (p||"").replace(/\D/g,"").trim();
  return d;
}

// ---------- تجميع الأجهزة في فواتير (نفس منطق admin.html) ----------
function groupIntoInvoices(devicesArr){
  const map = {};
  devicesArr.forEach(d=>{
    const key = d.invoiceId || d.code;
    if(!map[key]) map[key] = { invoiceId:key, date: d.invoiceCreatedAt||d.createdAt||0, devices: [] };
    map[key].devices.push(d);
  });
  return Object.values(map).map(inv=>{
    const totalCost = inv.devices.reduce((s,d)=>s+(d.cost||0),0);
    const totalPaid = inv.devices.reduce((s,d)=>s+(d.paid||0),0);
    const totalDiscount = inv.devices.reduce((s,d)=>s+(d.discountApplied||0),0);
    const deliveredCount = inv.devices.filter(d=>d.status==="تم التسليم").length;
    return { ...inv, deviceCount: inv.devices.length, totalCost, totalPaid, totalDiscount, deliveredCount, remainingCount: inv.devices.length-deliveredCount };
  }).sort((a,b)=> (b.date||0)-(a.date||0));
}

let currentPhone = null;
let currentCust = null;
let pwVisible = false;

document.getElementById("btnLogin").addEventListener("click", doLogin);
document.getElementById("loginPhone").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
document.getElementById("loginPassword").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });

async function doLogin(){
  const msg = document.getElementById("loginMsg");
  const phoneRaw = document.getElementById("loginPhone").value;
  const phone = normalizePhone(phoneRaw);
  const password = document.getElementById("loginPassword").value.trim();
  if(!phone || phone.length<8){ msg.textContent="اكتب رقم تليفون صحيح."; msg.className="msg bad"; return; }
  if(!password){ msg.textContent="اكتب الباسورد."; msg.className="msg bad"; return; }
  msg.textContent="جارٍ الدخول..."; msg.className="msg";
  try{
    const csnap = await getDoc(doc(db,"customers",phone));
    if(!csnap.exists()){ msg.textContent="مفيش بيانات مسجلة بهذا الرقم. تواصل مع المركز للتأكد."; msg.className="msg bad"; return; }
    const cust = csnap.data();
    if(!cust.portalPassword) cust.portalPassword = phone.slice(-4); // الباسورد الافتراضي: آخر ٤ أرقام من التليفون
    if(cust.portalPassword !== password){ msg.textContent="الباسورد غلط."; msg.className="msg bad"; return; }
    const dsnaps = await getDocs(query(collection(db,"devices"), where("customerPhone","==",phone)));
    const devices = dsnaps.docs.map(d=>d.data());
    currentPhone = phone;
    currentCust = cust;
    msg.textContent=""; msg.className="msg";
    showCustomer(cust.name||"عميلنا العزيز", devices);
  }catch(e){ msg.textContent="حصل خطأ، حاول تاني."; msg.className="msg bad"; console.error(e); }
}

document.getElementById("btnLogout").addEventListener("click", ()=>{
  currentPhone = null; currentCust = null; pwVisible = false;
  document.getElementById("custBox").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
  document.getElementById("loginPhone").value = "";
  document.getElementById("loginPassword").value = "";
  document.getElementById("loginMsg").textContent = "";
});

let currentDevices = [];
let viewMode = "invoices";

function showCustomer(name, devices){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("custBox").classList.remove("hidden");
  document.getElementById("custName").textContent = `أهلًا، ${name} 👋`;

  currentDevices = devices;
  const inCenter = devices.filter(d=>d.status!=="تم التسليم").length;
  const totalDue = devices.reduce((s,d)=>s+((d.cost||0)-(d.paid||0)-(d.discountApplied||0)),0);
  const devDue = Math.max(totalDue,0);
  const extraDebt = Math.max(Number(currentCust && currentCust.debt)||0, 0);
  document.getElementById("kpiInCenter").textContent = inCenter;
  document.getElementById("kpiDevDue").textContent = devDue;
  document.getElementById("kpiDebt").textContent = extraDebt;
  document.getElementById("kpiDue").textContent = devDue + extraDebt;
  renderPw();

  viewMode = "invoices";
  renderCustView();
}

function renderPw(){
  const pw = (currentCust && currentCust.portalPassword) || "";
  document.getElementById("pwDisplay").textContent = pwVisible ? pw : "•".repeat(Math.max(pw.length,6));
  document.getElementById("btnTogglePw").textContent = pwVisible ? "إخفاء" : "إظهار";
}
document.getElementById("btnTogglePw").addEventListener("click", ()=>{ pwVisible = !pwVisible; renderPw(); });
document.getElementById("btnChangePw").addEventListener("click", ()=>{
  openModal(`<h3>🔑 تغيير الباسورد</h3>
    <label>الباسورد الحالي</label><input id="pw_old" type="password" autocomplete="off">
    <label>الباسورد الجديد (٤ حروف/أرقام على الأقل)</label><input id="pw_new" type="password" autocomplete="off">
    <label>أكّد الباسورد الجديد</label><input id="pw_new2" type="password" autocomplete="off">
    <button class="primary" id="pw_save">حفظ</button>
    <button class="primary ghost" id="pw_cancel" style="margin-top:8px;">إلغاء</button>
    <div class="msg" id="pw_msg"></div>`);
  document.getElementById("pw_cancel").addEventListener("click", closeModal);
  document.getElementById("pw_save").addEventListener("click", async ()=>{
    const msg = document.getElementById("pw_msg");
    const o = document.getElementById("pw_old").value.trim();
    const n = document.getElementById("pw_new").value.trim();
    const n2 = document.getElementById("pw_new2").value.trim();
    if(o !== currentCust.portalPassword){ msg.textContent="الباسورد الحالي غلط."; msg.className="msg bad"; return; }
    if(n.length < 4){ msg.textContent="الباسورد الجديد قصير (٤ على الأقل)."; msg.className="msg bad"; return; }
    if(n !== n2){ msg.textContent="الباسورد الجديد وتأكيده مش متطابقين."; msg.className="msg bad"; return; }
    msg.textContent="جارٍ الحفظ..."; msg.className="msg";
    try{
      if(!auth.currentUser) await signInAnonymously(auth);
      await setDoc(doc(db,"customers",currentPhone), {portalPassword:n}, {merge:true});
      currentCust.portalPassword = n;
      renderPw();
      msg.textContent="تم تغيير الباسورد ✅"; msg.className="msg ok";
      setTimeout(closeModal, 1200);
    }catch(e){ msg.textContent="تعذر الحفظ، حاول تاني."; msg.className="msg bad"; console.error(e); }
  });
});

document.getElementById("btnViewInvoices").addEventListener("click", ()=>{
  viewMode = "invoices";
  document.getElementById("btnViewInvoices").className = "primary";
  document.getElementById("btnViewDevices").className = "ghost";
  document.getElementById("statusFilterBar").classList.add("hidden");
  renderCustView();
});
document.getElementById("btnViewDevices").addEventListener("click", ()=>{
  viewMode = "devices";
  document.getElementById("btnViewDevices").className = "primary";
  document.getElementById("btnViewInvoices").className = "ghost";
  document.getElementById("statusFilterBar").classList.remove("hidden");
  renderCustView();
});
document.getElementById("statusFilter").addEventListener("change", renderCustView);

function renderCustView(){
  const list = document.getElementById("invoicesList");
  if(viewMode==="devices"){
    const statusVal = document.getElementById("statusFilter").value;
    const filtered = statusVal ? currentDevices.filter(d=>d.status===statusVal) : currentDevices;
    if(!filtered.length){ list.innerHTML = `<div class="hint">مفيش أجهزة مطابقة لهذا الفلتر.</div>`; return; }
    list.innerHTML = filtered.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(d=> deviceCardHtml(d)).join("");
    return;
  }
  const invoices = groupIntoInvoices(currentDevices);
  list.innerHTML = invoices.map(inv=>{
    const remaining = inv.totalCost - inv.totalPaid - (inv.totalDiscount||0);
    return `
    <div class="inv-item">
      <div class="inv-top">
        <div>
          <div class="inv-code">فاتورة ${esc(inv.invoiceId)}</div>
          <div class="inv-sub">${inv.date?new Date(inv.date).toLocaleDateString('ar-EG'):"—"} · ${inv.deviceCount} جهاز</div>
        </div>
        <button class="ghost" data-viewinv="${esc(inv.invoiceId)}">عرض التفاصيل</button>
      </div>
      <div class="inv-badges">
        <span class="status-badge" style="background:#64748b;">الإجمالي ${inv.totalCost} ج</span>
        ${remaining>0?`<span class="status-badge" style="background:#b45309;">متبقي ${remaining} ج</span>`:`<span class="status-badge" style="background:#059669;">مسددة بالكامل</span>`}
        ${inv.remainingCount===0?'<span class="status-badge" style="background:#7c3aed;">كل الأجهزة اتسلّمت</span>':''}
      </div>
    </div>`;
  }).join("") || `<div class="hint">مفيش فواتير مسجلة لسه.</div>`;

  list.querySelectorAll("[data-viewinv]").forEach(b=> b.addEventListener("click", ()=> showInvoiceDetails(invoices.find(x=>x.invoiceId===b.dataset.viewinv))));
}

function deviceCardHtml(d){
  const dueD = (d.cost||0)-(d.paid||0)-(d.discountApplied||0);
  const photos = (d.photos||[]).map(u=>`<img class="lightbox-trigger" src="${u}">`).join("");
  return `<div class="device-card">
    <h4>🎮 ${esc(d.model||"جهاز")} <span class="status-badge" style="background:${STATUS_COLORS[d.status]||'#64748b'};">${esc(d.status||"—")}</span></h4>
    <div class="device-row"><span>كود الجهاز</span><b>${esc(d.code)}</b></div>
    ${d.invoiceId?`<div class="device-row"><span>رقم الفاتورة</span><span>${esc(d.invoiceId)}</span></div>`:""}
    <div class="device-row"><span>العطل</span><span>${esc((d.faults||[]).join("، ")||"—")}</span></div>
    <div class="device-row"><span>التشخيص</span><span>${esc((d.diagnoses||[]).join("، ")||"—")}</span></div>
    <div class="device-row"><span>التكلفة</span><span>${d.cost||0} ج</span></div>
    <div class="device-row"><span>المدفوع</span><span>${d.paid||0} ج</span></div>
    <div class="device-row"><span>المتبقي</span><span>${Math.max(dueD,0)} ج</span></div>
    <div class="device-row"><span>الضمان</span><span>${esc(d.warranty||"—")}</span></div>
    ${d.notes?`<div class="device-row"><span>ملاحظات</span><span>${esc(d.notes)}</span></div>`:""}
    ${photos?`<div class="photo-row">${photos}</div>`:""}
  </div>`;
}
function showInvoiceDetails(inv){
  const remaining = inv.totalCost - inv.totalPaid - (inv.totalDiscount||0);
  const devicesHtml = inv.devices.map(d=> deviceCardHtml(d)).join("");
  openModal(`<h3>فاتورة ${esc(inv.invoiceId)}</h3>
    <div class="kpi-grid" style="margin-bottom:12px;">
      <div class="kpi"><div class="num">${inv.totalCost}</div><div class="lbl">إجمالي الفاتورة</div></div>
      <div class="kpi"><div class="num">${Math.max(remaining,0)}</div><div class="lbl">المتبقي</div></div>
    </div>
    ${devicesHtml}
    <button class="primary" id="btnCloseInv">إغلاق</button>`);
  document.getElementById("btnCloseInv").addEventListener("click", closeModal);
}
</script>
</body>
</html>
